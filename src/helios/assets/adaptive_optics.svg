<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Actuators -->
  <rect x="20" y="65" width="10" height="20" fill="#95A5A6" rx="2"/>
  <rect x="35" y="60" width="10" height="25" fill="#95A5A6" rx="2"/>
  <rect x="50" y="68" width="10" height="17" fill="#95A5A6" rx="2"/>
  <rect x="65" y="62" width="10" height="23" fill="#95A5A6" rx="2"/>
  
  <!-- Base -->
  <rect x="10" y="85" width="80" height="10" fill="#2C3E50" rx="2"/>
  
  <!-- Deformable Mirror Surface -->
  <path d="M15,65 C25,65 30,60 40,60 C50,60 55,68 65,68 C75,68 80,62 85,62" fill="none" stroke="#3498DB" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Incoming Wavefront (Distorted) -->
  <path d="M20,20 Q35,10 50,20 T80,20" fill="none" stroke="#E74C3C" stroke-width="3" opacity="0.7"/>
  
  <!-- Corrected Wavefront (Flat) -->
  <line x1="20" y1="40" x2="80" y2="40" stroke="#2ECC71" stroke-width="3"/>
  
  <!-- Arrow indicating action -->
  <path d="M50,25 L50,35" stroke="#2C3E50" stroke-width="2"/>
</svg>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Coronagraph mask - circular with cross pattern -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Cross pattern (blocking center) -->
  <line x1="50" y1="25" x2="50" y2="75" stroke="#000000" stroke-width="4"/>
  <line x1="25" y1="50" x2="75" y2="50" stroke="#000000" stroke-width="4"/>
  <!-- Center blocking disk -->
  <circle cx="50" cy="50" r="8" fill="#000000"/>
</svg>

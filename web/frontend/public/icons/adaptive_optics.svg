<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Wavy incoming wavefront (top) -->
  <path d="M20,25 Q30,20 40,25 Q50,30 60,25 Q70,20 80,25" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Deformable mirror (curved) -->
  <path d="M25,50 Q50,42 75,50" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Actuators (small dots below mirror) -->
  <circle cx="30" cy="55" r="2.5" fill="#000000"/>
  <circle cx="42" cy="55" r="2.5" fill="#000000"/>
  <circle cx="50" cy="54" r="2.5" fill="#000000"/>
  <circle cx="58" cy="55" r="2.5" fill="#000000"/>
  <circle cx="70" cy="55" r="2.5" fill="#000000"/>
  
  <!-- Straight corrected wavefront (bottom) -->
  <line x1="20" y1="75" x2="80" y2="75" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
</svg>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Telescope Array - Two telescopes diagonally (Bottom-Left to Top-Right) -->
  
  <!-- First Telescope (Bottom-Left) -->
  <g transform="translate(-10, 25) scale(0.8)">
    <!-- Main tube -->
    <line x1="25" y1="30" x2="65" y2="50" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <!-- Front aperture -->
    <circle cx="25" cy="30" r="8" fill="none" stroke="#000000" stroke-width="3"/>
    <!-- Eyepiece -->
    <circle cx="65" cy="50" r="5" fill="#000000"/>
    <!-- Mount -->
    <line x1="45" y1="40" x2="45" y2="65" stroke="#000000" stroke-width="6"/>
    <!-- Tripod legs -->
    <line x1="45" y1="65" x2="30" y2="85" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="45" y2="88" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="60" y2="85" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Second Telescope (Top-Right) -->
  <g transform="translate(35, -15) scale(0.8)">
    <!-- Main tube -->
    <line x1="25" y1="30" x2="65" y2="50" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <!-- Front aperture -->
    <circle cx="25" cy="30" r="8" fill="none" stroke="#000000" stroke-width="3"/>
    <!-- Eyepiece -->
    <circle cx="65" cy="50" r="5" fill="#000000"/>
    <!-- Mount -->
    <line x1="45" y1="40" x2="45" y2="65" stroke="#000000" stroke-width="6"/>
    <!-- Tripod legs -->
    <line x1="45" y1="65" x2="30" y2="85" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="45" y2="88" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="60" y2="85" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

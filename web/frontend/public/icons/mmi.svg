<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- MMI box -->
  <rect x="30" y="25" width="40" height="50" fill="none" stroke="#000000" stroke-width="3" rx="2"/>
  <!-- Multiple inputs (left) -->
  <line x1="10" y1="35" x2="30" y2="35" stroke="#000000" stroke-width="2"/>
  <line x1="10" y1="50" x2="30" y2="50" stroke="#000000" stroke-width="2"/>
  <line x1="10" y1="65" x2="30" y2="65" stroke="#000000" stroke-width="2"/>
  <!-- Multiple outputs (right) -->
  <line x1="70" y1="35" x2="90" y2="35" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="50" x2="90" y2="50" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="65" x2="90" y2="65" stroke="#000000" stroke-width="2"/>
  <!-- Internal mixing pattern -->
  <line x1="35" y1="35" x2="65" y2="65" stroke="#000000" stroke-width="1" opacity="0.5"/>
  <line x1="35" y1="65" x2="65" y2="35" stroke="#000000" stroke-width="1" opacity="0.5"/>
</svg>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Convex lens shape (biconvex) -->
  <!-- Left curve -->
  <path d="M30,30 Q20,50 30,70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right curve -->
  <path d="M70,30 Q80,50 70,70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Top and bottom connecting lines -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#000000" stroke-width="3"/>
  <line x1="30" y1="70" x2="70" y2="70" stroke="#000000" stroke-width="3"/>
  
  <!-- Optical axis (horizontal line through center) -->
  <line x1="15" y1="50" x2="85" y2="50" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Focal points (small dots) -->
  <circle cx="25" cy="50" r="2" fill="#000000"/>
  <circle cx="75" cy="50" r="2" fill="#000000"/>
  
  <!-- Light rays showing convergence -->
  <line x1="10" y1="35" x2="30" y2="40" stroke="#000000" stroke-width="2"/>
  <line x1="30" y1="40" x2="75" y2="50" stroke="#000000" stroke-width="2"/>
  
  <line x1="10" y1="65" x2="30" y2="60" stroke="#000000" stroke-width="2"/>
  <line x1="30" y1="60" x2="75" y2="50" stroke="#000000" stroke-width="2"/>
</svg>
